spring:
  profiles:
    active: local
  application:
    name: delivery-service

  data:
    redis:
      host: localhost # Docker 환경이라면 컨테이너 이름 또는 IP
      port: 6380

  rabbitmq:
    host: localhost
    port: 5673 # 커스텀 포트 번호
    username: guest # 기본 (추후 수정 필요)
    password: guest # 기본 (추후 수정 필요)
    exchange:
      name: order-exchange # 교환기 이름
      queue:
        name: delivery-request-queue # 큐 이름
      routing:
        key: delivery.new # 라우팅 키
    create:
      queue:
        name: delivery.create.queue
      routing:
        key: delivery.create.new
    response:
      queue:
        name: delivery.created.response.queue # Order-Service가 응답을 받을 큐 이름
      routing:
        key: delivery.created.response
    delete:
      queue:
        name: delivery.delete.queue
      routing:
        key: delivery.delete.by.order
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 5000ms # 첫 재시도까지 5초 대기
          max-attempts: 3 # 최대 3회 재시도
          max-interval: 10000ms  # 최대 재시도 대기 시간 10초

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_schema: p_delivery
    show-sql: true

  datasource:
    url: jdbc:postgresql://localhost:5432/delivery_signal
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

server:
  port: 19091

internal:
  hub:
    url: http://localhost:19093
  user:
    url: http://localhost:19092
  external:
    url: http://localhost:19097

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

management:
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  tracing:
    sampling:
      probability: 1.0